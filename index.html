          height="1672"
          fetchpriority="high"
        />

    <main id="invitationMain" class="invitation" tabindex="-1" aria-label="Invitación a los XV años de Julia">
      <!-- Cada costura (.seam) une el hilo rojo de una pieza con el de la siguiente.
           data-from / data-to: dónde sale y dónde entra el hilo (en % del ancho).
           data-from-slope / data-to-slope: hacia dónde va el hilo en ese borde.
           data-height: alto de la costura (en % del ancho). -->
      <section class="panel panel--cover" aria-labelledby="cover-title">
        <h1 id="cover-title" class="sr-only">Mis XV, Julia</h1>
        <img src="assets/portada.webp?v=20261021-1" alt="Julia, mis XV" width="941" height="1672" fetchpriority="high" />
      </section>

      <div
        class="seam"
        data-from="42.2" data-from-slope="-0.62" data-to="27.2" data-to-slope="2.2" data-height="12"
        style="--seam-image: url(assets/costuras/costura-1.webp?v=20261021-1)"
      ></div>

      <section class="panel panel--countdown" aria-labelledby="countdown-title">
        <h2 id="countdown-title" class="sr-only">Falta cada vez menos</h2>
        <img
          src="assets/cuenta-regresiva.webp?v=20261021-1"
          alt="Falta cada vez menos. ¡Qué reloj más divertido! ¡Dice el día del mes y no la hora!"
          width="941"
          height="1672"
          loading="lazy"
        />
        <div class="countdown" role="timer" aria-live="off" aria-label="Tiempo restante para la fiesta">
          <span id="days" class="countdown__value countdown__value--days">00</span>
          <span id="hours" class="countdown__value countdown__value--hours">00</span>
          <span id="minutes" class="countdown__value countdown__value--minutes">00</span>
          <span id="seconds" class="countdown__value countdown__value--seconds">00</span>
        </div>
      </section>

      <div
        class="seam"
        data-from="44.3" data-from-slope="0" data-to="27.8" data-to-slope="0.92" data-height="12"
        style="--seam-image: url(assets/costuras/costura-2.webp?v=20261021-1)"
      ></div>

      <section class="panel panel--date" aria-labelledby="date-title">
        <h2 id="date-title" class="sr-only">Fecha y hora</h2>
        <img
          src="assets/fecha-hora.webp?v=20261021-1"
          alt="23 de enero, de 21:00 a 02:00 horas. ¡No llegues tarde! Recordá ser puntual"
          width="941"
          height="1672"
          loading="lazy"
        />
        <button id="calendarButton" class="hotspot hotspot--calendar" type="button">
          <span class="sr-only">Agregar al calendario</span>
        </button>
      </section>

      <div

        data-from="72.6" data-from-slope="1.22" data-to="51.1" data-to-slope="0.24" data-height="12"

      </section>

      <!-- El hilo sigue de largo hacia el costado y vuelve a entrar en el footer. -->
      <div
        class="seam"
        data-from="80.4" data-from-slope="0.9" data-to="104" data-to-slope="1.6" data-height="10"

    <dialog id="giftsModal" class="image-modal" aria-label="Datos para regalo">

        <button
